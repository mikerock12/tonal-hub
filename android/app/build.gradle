plugins { id 'com.android.application' }
android {
    namespace 'app.tonal.android'
    compileSdk 36
    defaultConfig {
        applicationId 'app.tonal.android'
        minSdk 28
        targetSdk 36
        versionCode 27
        versionName '0.15.7-local'
        if (project.hasProperty('tonalAbi')) {
            ndk { abiFilters project.property('tonalAbi').toString() }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
        benchmark { initWith release; debuggable true; applicationIdSuffix '.benchmark' }
        comparison { initWith release; debuggable false; applicationIdSuffix '.comparison' }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}
