[package]
name = "tonal-jam-transport"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "tonal_jam_transport"

[[bin]]
name = "TonalJam"
path = "src/main.rs"

[dependencies]
librespot-core = { path = "../../android/native/vendor/librespot-core", default-features = false, features = ["rustls-tls-webpki-roots"] }
hyper = "=1.12.0"
bytes = "=1.12.1"
http-body-util = "=0.1.3"
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "macros", "net"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
