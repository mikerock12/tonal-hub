name: Android Halloween visual regression
on:
  pull_request:
    paths:
      - 'android/app/src/**'
      - 'android/app/build.gradle'
      - '.github/workflows/android-halloween-visual.yml'
permissions:
  contents: read
jobs:
  android-components:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Reuse unchanged native libraries from the published 0.15.4 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.15.4 --repo mikerock12/tonal-hub --pattern Tonal-Android-0.15.4-local.apk
          echo '59968dd69a786331d55a21d811fcc3ed7a364ad5a8324ba0331fbc862b0bde02  Tonal-Android-0.15.4-local.apk' | sha256sum -c -
          unzip -q Tonal-Android-0.15.4-local.apk 'lib/x86_64/*' -d /tmp/tonal-native
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp /tmp/tonal-native/lib/x86_64/*.so android/app/src/main/jniLibs/x86_64/
      - name: Build isolated benchmark fixture
        run: gradle -p android :app:assembleBenchmark --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-tonal-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install android/app/build/outputs/apk/benchmark/app-benchmark.apk
            adb shell am instrument -w -e action halloweenTests app.tonal.android.benchmark/app.tonal.android.DeviceInstrumentation | tee /tmp/result.txt
            adb logcat -d -s AndroidRuntime:E | tail -100
            adb pull /sdcard/Android/data/app.tonal.android.benchmark/files/halloween-0154 evidence || true
            grep -q '"passed":true' /tmp/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-halloween-0156-synthetic
          path: evidence/*.png
          if-no-files-found: warn
