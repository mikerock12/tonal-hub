name: Tonal private CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tonal-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-jam-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the native endpoint allowlist without Spotify credentials
        run: cargo test --manifest-path native/jam-transport/Cargo.toml --locked --release --jobs 2
  native-story-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned open source runtime and build the C++ reader
        run: |
          python packaging/fetch-story-runtime.py
          cmake -S src/stories -B out/ci-stories -DCMAKE_BUILD_TYPE=Release -DTONAL_STORY_CORE_ONLY=ON
          cmake --build out/ci-stories --parallel 2
          ctest --test-dir out/ci-stories --output-on-failure
  personal-library:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce the tiny local model from its original training corpus
        shell: pwsh
        run: |
          python training/train_muse.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/insights/MuseWeights.inc
      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0 Pillow
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP/Qt"
      - name: Build and test actual C++ library
        shell: pwsh
        run: |
          $qt = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          $env:PATH = "$qt/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qt/plugins"
          cmake -S tests/companion -B out/ci -A x64 "-DCMAKE_PREFIX_PATH=$qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/ci --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir out/ci -C Release --output-on-failure
      - name: Test translation on the actual lyrics screen without network access
        shell: pwsh
        run: |
          $env:QTDIR = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          python tests/lyrics/run_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/playlist/run_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/themes/check_themes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/mix/run_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/themes/halloween_ui.py
  android-java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test shared portable C++ playlist rules
        run: |
          mkdir -p out/ci-playlist
          g++ -std=c++20 -O2 -Isrc tests/playlist/CoreChecks.cpp src/playlist/TextPlaylistCore.cpp -o out/ci-playlist/core-checks
          out/ci-playlist/core-checks
          g++ -std=c++20 -O2 -Isrc tests/mix/CoreChecks.cpp src/playback/ListeningMixCore.cpp src/playlist/TextPlaylistCore.cpp -o out/ci-playlist/mix-checks
          out/ci-playlist/mix-checks
      - name: Reject unsolicited playback and late recovery
        run: |
          mkdir -p out/ci-playback
          javac -d out/ci-playback android/app/src/main/java/app/tonal/android/PlaybackIntent.java android/app/src/main/java/app/tonal/android/RepeatMode.java tests/android/PlaybackSafetyChecks.java
          java -cp out/ci-playback app.tonal.android.PlaybackSafetyChecks
      - name: Compile both Android variants without account credentials
        run: gradle -p android compileReleaseJavaWithJavac compileBenchmarkJavaWithJavac compileComparisonJavaWithJavac :automation:compileDebugJavaWithJavac --console=plain
      - name: Cross-compile the baseline and guarded accelerated ARM64 readers
        run: |
          sdkmanager 'ndk;27.0.12077973'
          python packaging/fetch-story-runtime.py
          for variant in baseline fast; do
            accelerated=OFF
            if [ "$variant" = fast ]; then accelerated=ON; fi
            cmake -S src/stories -B "out/ci-reader-$variant" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
              -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release \
              -DTONAL_STORY_ARM_FAST="$accelerated"
            cmake --build "out/ci-reader-$variant" --target tonal_story --parallel 2
          done
